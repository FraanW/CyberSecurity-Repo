# Every value here comes from an environment variable — no PingFederate hostname, client ID or
# secret ever lands in git.
server:
  port: ${PORT:8080}
  # Render terminates TLS at its edge. Without this, Spring builds an http:// redirect_uri and
  # PingFederate rejects it as not matching the registered one.
  forward-headers-strategy: framework

spring:
  application:
    name: pingfed-oauth-client
  mvc:
    problemdetails:
      enabled: true

lab:
  oauth:
    registration-id: ${LAB_OAUTH_REGISTRATION_ID:pingfed}
    public-base-url: ${PUBLIC_BASE_URL:}

    # --- Option A: discovery (set this one and skip the endpoint block below) ---
    issuer-uri: ${LAB_OAUTH_ISSUER_URI:}

    # --- Option B: type the endpoints yourself ---
    authorization-uri: ${LAB_OAUTH_AUTHORIZATION_URI:}
    token-uri: ${LAB_OAUTH_TOKEN_URI:}
    jwk-set-uri: ${LAB_OAUTH_JWKS_URI:}
    user-info-uri: ${LAB_OAUTH_USERINFO_URI:}

    # Not part of OIDC discovery on every PingFederate build — usually set by hand.
    introspection-uri: ${LAB_OAUTH_INTROSPECTION_URI:}
    end-session-uri: ${LAB_OAUTH_END_SESSION_URI:}

    # --- the client you created in the PingFederate console ---
    client-id: ${LAB_OAUTH_CLIENT_ID:}
    client-secret: ${LAB_OAUTH_CLIENT_SECRET:}
    scopes: ${LAB_OAUTH_SCOPES:openid,profile,email}
    client-authentication-method: ${LAB_OAUTH_CLIENT_AUTH_METHOD:client_secret_basic}
    use-pkce: ${LAB_OAUTH_USE_PKCE:true}

    # Full token values in API responses. Great for learning, wrong for anything real.
    reveal-tokens: ${LAB_OAUTH_REVEAL_TOKENS:true}

    # --- optional second client, restricted to the Client Credentials grant ---
    machine-client-id: ${LAB_OAUTH_MACHINE_CLIENT_ID:}
    machine-client-secret: ${LAB_OAUTH_MACHINE_CLIENT_SECRET:}
    machine-scopes: ${LAB_OAUTH_MACHINE_SCOPES:}

  # The app's own username/password login — what makes this deployable and usable before any
  # PingFederate configuration exists. Leave the password blank and one is generated per boot
  # and printed in the startup logs.
  local:
    username: ${LAB_LOCAL_USERNAME:farhaan}
    password: ${LAB_LOCAL_PASSWORD:}
    roles: ${LAB_LOCAL_ROLES:USER,LAB}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    # DEBUG here prints the exact token request and PingFederate's exact error back.
    org.springframework.security.oauth2: ${LAB_OAUTH_LOG_LEVEL:INFO}
