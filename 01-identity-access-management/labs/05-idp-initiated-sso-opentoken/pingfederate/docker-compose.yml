# Lab 05 — a real PingFederate on your laptop, plus a tunnel so the browser can reach it
# from anywhere. LAB ONLY: evaluation licence, dummy users, never FinCo configuration.
#
#   cp env.example .env                        # then fill it in
#   cp <your file>.lic license/pingfederate.lic   # your 30-day licence file (git-ignored)
#   docker compose up -d
#   docker compose logs -f pingfederate     # wait for "PingFederate is up"  (2-4 minutes)
#   docker compose logs tunnel | grep trycloudflare.com      # your public runtime URL
#
# Admin console : https://localhost:9999/pingfederate/app   (self-signed cert: accept the warning)
# Runtime       : https://localhost:9031   and the public tunnel URL

services:
  pingfederate:
    # The image version must match the version your licence file was issued for (see .env).
    image: pingidentity/pingfederate:${PF_IMAGE_TAG:-latest}
    restart: unless-stopped   # come back by itself after WSL or Docker restarts
    environment:
      PING_IDENTITY_ACCEPT_EULA: "YES"
      # Only needed if you have NO licence file and use Ping's DevOps evaluation licence instead.
      PING_IDENTITY_DEVOPS_USER: ${PING_IDENTITY_DEVOPS_USER:-}
      PING_IDENTITY_DEVOPS_KEY: ${PING_IDENTITY_DEVOPS_KEY:-}
      # Ping's "getting started" profile: an admin account and sensible defaults.
      SERVER_PROFILE_URL: https://github.com/pingidentity/pingidentity-server-profiles.git
      SERVER_PROFILE_PATH: getting-started/pingfederate
      # Console sign-in is user "administrator" with this password.
      PING_IDENTITY_PASSWORD: ${PF_ADMIN_PASSWORD:?set it in .env}
    ports:
      - "127.0.0.1:9999:9999"   # admin console: this laptop only, never through the tunnel
      - "127.0.0.1:9031:9031"   # runtime engine
    volumes:
      - pf-out:/opt/out         # keeps your configuration across restarts
      # Your licence file. It must exist BEFORE `up`, or Docker creates a folder in its place.
      - ./license/pingfederate.lic:/opt/in/instance/server/default/conf/pingfederate.lic:ro

  # Publishes ONLY the runtime port (9031). The URL is random and changes on every restart
  # of this container, so leave it running for the whole demo.
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped   # come back by itself after WSL or Docker restarts
    command: tunnel --no-autoupdate --no-tls-verify --url https://pingfederate:9031
    depends_on:
      - pingfederate

  # Keeps the two free Render services awake. They sleep after 15 minutes without traffic.
  # Render's free tier gives 750 instance-hours a month for the whole workspace; two services
  # kept awake 24/7 use ~1,440. So run this only while you work:
  #   docker compose stop pinger      /      docker compose start pinger
  pinger:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    environment:
      PING_URLS: ${PING_URLS:-}                     # space-separated, set in .env
      PING_EVERY_SECONDS: ${PING_EVERY_SECONDS:-600}  # 10 min, under Render's 15-min sleep timer
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        [ -z "$$PING_URLS" ] && { echo "PING_URLS is empty in .env; nothing to ping"; exec sleep infinity; }
        while true; do
          for u in $$PING_URLS; do
            code=$$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 "$$u")
            echo "$$(date -u +%FT%TZ) $$code $$u"
          done
          sleep "$$PING_EVERY_SECONDS"
        done

volumes:
  pf-out:
